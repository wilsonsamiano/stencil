[package]
name = "stencil-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stencil QR studio command line"
publish = false

[[bin]]
name = "stencil"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
stencil-core = { path = "../stencil-core" }
